<div class="min-h-screen flex flex-col bg-stone-50" style="padding-bottom: calc(5rem + env(safe-area-inset-bottom))">
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Promo popup -->
  <app-promo-popup />

  <!-- Bottom Navigation -->
  <nav
    class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-white/30 z-40 shadow-[0_-1px_24px_rgba(0,0,0,0.08)]"
    style="padding-bottom: env(safe-area-inset-bottom)"
  >
    <div class="flex items-center justify-around h-16 max-w-lg mx-auto px-1">
      <a
        routerLink="/menu"
        routerLinkActive
        #menuLink="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: false }"
        [class.text-amber-500]="menuLink.isActive"
        [class.text-stone-400]="!menuLink.isActive"
        class="flex flex-col items-center gap-0.5 hover:text-amber-500 transition-all duration-200 min-w-14 py-1"
        aria-label="Menu"
      >
        <span class="transition-transform duration-200"
              [class.scale-110]="menuLink.isActive"
              [class.-translate-y-0.5]="menuLink.isActive">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6M9 16h4" />
          </svg>
        </span>
        <span class="text-[10px] font-semibold transition-all duration-200" [class.font-bold]="menuLink.isActive">{{ 'nav.menu' | t }}</span>
      </a>

      <!-- Cart with badge -->
      <a
        routerLink="/cart"
        routerLinkActive
        #cartLink="routerLinkActive"
        [class.text-amber-500]="cartLink.isActive"
        [class.text-stone-400]="!cartLink.isActive"
        class="relative flex flex-col items-center gap-0.5 hover:text-amber-500 transition-all duration-200 min-w-14 py-1"
        aria-label="Cart"
      >
        @if (cart.count() > 0) {
          <span class="absolute -top-0.5 right-2.5 min-w-4.5 h-4.5 bg-amber-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 leading-none">
            {{ cart.count() > 99 ? '99+' : cart.count() }}
          </span>
        }
        <span class="transition-transform duration-200"
              [class.scale-110]="cartLink.isActive"
              [class.-translate-y-0.5]="cartLink.isActive">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 6h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z" />
          </svg>
        </span>
        <span class="text-[10px] font-semibold transition-all duration-200" [class.font-bold]="cartLink.isActive">{{ 'nav.cart' | t }}</span>
      </a>

      <a
        routerLink="/orders"
        routerLinkActive
        #ordersLink="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: false }"
        [class.text-amber-500]="ordersLink.isActive"
        [class.text-stone-400]="!ordersLink.isActive"
        class="flex flex-col items-center gap-0.5 hover:text-amber-500 transition-all duration-200 min-w-14 py-1"
        aria-label="Orders"
      >
        <span class="transition-transform duration-200"
              [class.scale-110]="ordersLink.isActive"
              [class.-translate-y-0.5]="ordersLink.isActive">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7 4h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z" />
          </svg>
        </span>
        <span class="text-[10px] font-semibold transition-all duration-200" [class.font-bold]="ordersLink.isActive">{{ 'nav.orders' | t }}</span>
      </a>

      <a
        routerLink="/news"
        routerLinkActive
        #newsLink="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: false }"
        [class.text-amber-500]="newsLink.isActive"
        [class.text-stone-400]="!newsLink.isActive"
        class="flex flex-col items-center gap-0.5 hover:text-amber-500 transition-all duration-200 min-w-14 py-1"
        aria-label="News"
      >
        <span class="transition-transform duration-200"
              [class.scale-110]="newsLink.isActive"
              [class.-translate-y-0.5]="newsLink.isActive">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="7" y1="9" x2="17" y2="9" stroke-linecap="round"/>
            <line x1="7" y1="13" x2="13" y2="13" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="text-[10px] font-semibold transition-all duration-200" [class.font-bold]="newsLink.isActive">{{ 'nav.news' | t }}</span>
      </a>

      <a
        routerLink="/profile"
        routerLinkActive
        #profileLink="routerLinkActive"
        [class.text-amber-500]="profileLink.isActive"
        [class.text-stone-400]="!profileLink.isActive"
        class="flex flex-col items-center gap-0.5 hover:text-amber-500 transition-all duration-200 min-w-14 py-1"
        aria-label="Profile"
      >
        <span class="transition-transform duration-200"
              [class.scale-110]="profileLink.isActive"
              [class.-translate-y-0.5]="profileLink.isActive">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </span>
        <span class="text-[10px] font-semibold transition-all duration-200" [class.font-bold]="profileLink.isActive">{{ 'nav.profile' | t }}</span>
      </a>
    </div>
  </nav>
</div>
